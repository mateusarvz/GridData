[tool.poetry]
name = "damabox-backend"
version = "0.1.0"
description = "Dama Box Backend API - Clean Architecture & Multi-Tenant PostgreSQL"
authors = ["Dama Box Team <dev@damabox.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.7.4"
pydantic-settings = "^2.3.4"
pyjwt = "^2.8.0"
argon2-cffi = "^23.1.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
redis = "^5.0.4"
boto3 = "^1.34.120"
supabase = "^2.31.0"
pandas = "^3.0.3"
openpyxl = "^3.1.5"
pyarrow = "^25.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
testcontainers = "^4.5.0"
ruff = "^0.4.8"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
